<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log ind eller opret dig — Eventplan</title>
  <meta name="description" content="Opret din Eventplan-konto eller log ind for at planlægge events." />
  <link rel="icon" href="assets/logo-mark-white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("eventlink-theme");
      document.documentElement.setAttribute(
        "data-theme",
        saved === "light" || saved === "dark" ? saved : "dark"
      );
    })();
  </script>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-shell">
      <div class="header-inner">
        <div class="header-left">
          <a class="brand-lockup" href="index.html" aria-label="Eventplan">
            <img class="brand-logo dark-only" src="assets/logo-white.png" alt="Eventplan" width="148" height="37" />
            <img class="brand-logo light-only" src="assets/logo-blue.png" alt="Eventplan" width="148" height="37" />
          </a>

          <nav class="nav-links" aria-label="Hovednavigation">
            <a class="nav-link" href="index.html#features">
              <svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M13.55 2.18a1.1 1.1 0 011.5.2l.08.11 6.38 10.2a1.1 1.1 0 01-.34 1.52l-.11.06-2.96.92-1.68 2.78a1.1 1.1 0 01-1.45.42l-.1-.06-8.95-6.48a1.1 1.1 0 01-.3-1.5l.06-.1 1.68-2.78.92-2.96a1.1 1.1 0 011.28-.74l.12.03 4.85 1.78z"/><path fill="currentColor" d="M5.1 15.95c.72-.55 1.86-.2 2.7.7.84.9 1.1 2.04.4 2.72-.95.9-2.95.5-4.2-.84-1.24-1.33-1.5-3.3-.5-4.1.2-.16.4-.27.6-.38z"/><circle cx="15.35" cy="9.05" r="1.25" fill="var(--bg)"/></svg>
              <span>Udforsk</span>
            </a>
            <a class="nav-link" href="index.html#how">
              <svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.9 3.15 20.4 7.4c.5.28.8.8.8 1.36v.08l-8.35 4.7a1.6 1.6 0 01-1.7 0L2.8 8.84v-.08c0-.56.3-1.08.8-1.36l7.5-4.25c.37-.21.83-.21 1.2 0z"/><path fill="currentColor" opacity=".88" d="M3.1 10.7v5.95c0 .55.3 1.05.78 1.33l7.27 4.12c.26.15.55.22.85.22V13.2L3.1 10.7z"/><path fill="currentColor" d="M20.9 10.7l-8.9 2.5v8.12c.3 0 .59-.07.85-.22l7.27-4.12c.48-.28.78-.78.78-1.33V10.7z"/></svg>
              <span>Sådan virker det</span>
            </a>
            <a class="nav-link" href="index.html#pricing">
              <svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2.4c.35 0 .68.18.86.48l2.5 4.18 4.72.9c.7.13 1 .9.52 1.4l-3.3 3.45.6 4.95c.09.7-.6 1.23-1.23.93L12 16.95l-4.67 2.74c-.63.3-1.32-.23-1.23-.93l.6-4.95-3.3-3.45c-.48-.5-.18-1.27.52-1.4l4.72-.9 2.5-4.18A1 1 0 0112 2.4z"/></svg>
              <span>Priser</span>
            </a>
          </nav>
        </div>

        <div class="header-actions">
          <button class="icon-btn theme-toggle" type="button" id="theme-toggle" aria-label="Skift mellem dark og light mode">
            <span class="theme-icon sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="theme-icon moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M20 13.5A7.5 7.5 0 1110.5 4 6 6 0 0020 13.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </span>
          </button>
          <a class="login-btn" href="auth.html?mode=login">Login</a>
          <button class="icon-btn nav-burger" type="button" id="nav-burger" aria-label="Åbn menu" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12H20M4 18H20M4 6H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="mobile-nav" id="mobile-nav" hidden>
      <a href="index.html#features">Funktioner</a>
      <a href="index.html#how">Sådan virker det</a>
      <a href="index.html#pricing">Priser</a>
      <a href="auth.html?mode=login">Login</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-page-bg" aria-hidden="true"></div>
    <section class="auth-card auth-page-card" id="auth-card">
      <div class="auth-tabs" role="tablist" aria-label="Konto">
        <button class="auth-tab is-active" type="button" data-tab="signup" role="tab" aria-selected="true">Opret bruger</button>
        <button class="auth-tab" type="button" data-tab="login" role="tab" aria-selected="false">Log ind</button>
        <span class="auth-tab-pill" aria-hidden="true"></span>
      </div>

      <div class="auth-copy">
        <h1 id="auth-title">Opret din konto</h1>
        <p id="auth-sub">Kom i gang på under et minut — så kan du oprette dit første event.</p>
      </div>

      <form class="auth-form" id="signup-form" autocomplete="on">
        <div class="field-row">
          <label class="field">
            <span>Fornavn</span>
            <input type="text" name="first_name" required maxlength="80" placeholder="Anna" />
          </label>
          <label class="field">
            <span>Efternavn</span>
            <input type="text" name="last_name" required maxlength="80" placeholder="Jensen" />
          </label>
        </div>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required maxlength="120" placeholder="dig@email.dk" autocomplete="email" />
        </label>
        <label class="field">
          <span>Telefonnummer</span>
          <input type="tel" name="phone" required maxlength="30" placeholder="+45 12 34 56 78" autocomplete="tel" />
        </label>
        <label class="field">
          <span>Adgangskode</span>
          <input type="password" name="password" required minlength="6" placeholder="Mindst 6 tegn" autocomplete="new-password" />
        </label>
        <button class="btn-primary auth-submit" type="submit">
          <span class="btn-label">Opret konto</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <form class="auth-form" id="login-form" hidden autocomplete="on">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required maxlength="120" placeholder="dig@email.dk" autocomplete="email" />
        </label>
        <label class="field">
          <span>Adgangskode</span>
          <input type="password" name="password" required minlength="6" placeholder="Din adgangskode" autocomplete="current-password" />
        </label>
        <button class="btn-primary auth-submit" type="submit">
          <span class="btn-label">Log ind</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="auth-status" id="auth-status" role="status" aria-live="polite" hidden></p>
      <p class="auth-foot"><a href="index.html">← Tilbage til forsiden</a></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
