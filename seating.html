<!DOCTYPE html>
<html lang="da" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bordplan-editor — Eventplan</title>
  <link rel="icon" href="assets/logo-mark-white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="event.css" />
  <link rel="stylesheet" href="seating.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("eventlink-theme");
      document.documentElement.setAttribute(
        "data-theme",
        saved === "light" || saved === "dark" ? saved : "light"
      );
    })();
  </script>
</head>
<body class="seat-editor-body">
  <div class="seat-boot" id="seat-boot">
    <div class="dash-boot-spinner" aria-hidden="true"></div>
    <p>Henter bordplan-editor…</p>
  </div>

  <div class="seat-editor" id="seat-editor" hidden>
    <header class="seat-topbar">
      <div class="seat-topbar-left">
        <a class="seat-back" id="seat-back" href="account.html">← Tilbage til event</a>
        <div>
          <p class="seat-kicker">Bordplan-editor</p>
          <h1 id="seat-event-title">Event</h1>
        </div>
      </div>
      <div class="seat-topbar-right">
        <span class="seat-save-status" id="seat-save-status">Klar</span>
        <button type="button" class="ev-btn ev-btn-ghost" id="seat-duplicate" title="Ctrl+C / Ctrl+V">Duplikér</button>
        <button type="button" class="ev-btn ev-btn-danger" id="seat-delete">Slet</button>
      </div>
    </header>

    <div class="seat-workspace">
      <aside class="seat-tools">
        <p class="seat-side-title">Tilføj bord</p>
        <button type="button" class="seat-tool" data-add-shape="round">
          <span class="seat-tool-preview is-round"></span>
          <span>Rundbord</span>
        </button>
        <button type="button" class="seat-tool" data-add-shape="oval">
          <span class="seat-tool-preview is-oval"></span>
          <span>Ovalt bord</span>
        </button>
        <button type="button" class="seat-tool" data-add-shape="rect">
          <span class="seat-tool-preview is-rect"></span>
          <span>Rektangulært</span>
        </button>
        <button type="button" class="seat-tool" data-add-shape="square">
          <span class="seat-tool-preview is-square"></span>
          <span>Kvadratisk</span>
        </button>
        <p class="seat-hint">Tip: Ctrl/Cmd + C / V kopierer og indsætter. Delete sletter. Træk i hjørner for at ændre størrelse.</p>
      </aside>

      <main class="seat-canvas-wrap">
        <div class="seat-canvas" id="seat-canvas" tabindex="0">
          <div class="seat-canvas-inner" id="seat-canvas-inner"></div>
        </div>
      </main>

      <aside class="seat-inspector">
        <p class="seat-side-title">Egenskaber</p>
        <div class="seat-props" id="seat-props">
          <p class="seat-props-empty">Vælg et bord for at redigere navn, form, pladser og størrelse.</p>
        </div>

        <p class="seat-side-title">Uplacerede gæster</p>
        <div class="seat-guest-pool" id="seat-guest-pool"></div>
      </aside>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="seating.js"></script>
</body>
</html>
