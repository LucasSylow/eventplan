<!DOCTYPE html>
<html lang="da" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bordplan-editor — Eventplan</title>
  <link rel="icon" href="assets/logo-mark-white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="event.css" />
  <link rel="stylesheet" href="seating.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("eventlink-theme");
      document.documentElement.setAttribute(
        "data-theme",
        saved === "light" || saved === "dark" ? saved : "light"
      );
    })();
  </script>
</head>
<body class="seat-editor-body">
  <div class="seat-boot" id="seat-boot">
    <div class="dash-boot-spinner" aria-hidden="true"></div>
    <p>Henter bordplan-editor…</p>
  </div>

  <div class="seat-editor" id="seat-editor" hidden>
    <header class="seat-topbar">
      <div class="seat-topbar-left">
        <a class="seat-back" id="seat-back" href="account.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tilbage
        </a>
        <div class="seat-topbar-divider" aria-hidden="true"></div>
        <div class="seat-topbar-titleblock">
          <p class="seat-kicker">Bordplan</p>
          <h1 id="seat-event-title">Event</h1>
        </div>
        <div class="seat-topbar-meta" id="seat-topbar-meta">
          <span id="seat-count-label">0 borde</span>
          <span id="seat-placed-label">0 placeret</span>
        </div>
      </div>

      <div class="seat-topbar-center">
        <div class="seat-toolbar-group" role="group" aria-label="Zoom">
          <button type="button" class="seat-icon-btn" id="seat-zoom-out" title="Zoom ud">−</button>
          <button type="button" class="seat-zoom-label" id="seat-zoom-label" title="Nulstil zoom">100%</button>
          <button type="button" class="seat-icon-btn" id="seat-zoom-in" title="Zoom ind">+</button>
        </div>
        <div class="seat-toolbar-group" role="group" aria-label="Bordværktøjer">
          <button type="button" class="seat-icon-btn" id="seat-rotate-ccw" title="Roter venstre" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M7 8H4v3M4.5 11A7.5 7.5 0 1 0 7 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="seat-icon-btn" id="seat-rotate-cw" title="Roter højre" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M17 8h3v3M19.5 11A7.5 7.5 0 1 1 17 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="seat-icon-btn" id="seat-duplicate" title="Duplikér (Ctrl+D)" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="seat-icon-btn is-danger" id="seat-delete" title="Slet (Delete)" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true"><path d="M5 7h14M10 11v5M14 11v5M9 7V5h6v2M7 7l1 12h8l1-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="seat-topbar-right">
        <span class="seat-save-status" id="seat-save-status">Klar</span>
        <a class="ev-btn" id="seat-done" href="account.html">Færdig</a>
      </div>
    </header>

    <div class="seat-workspace">
      <aside class="seat-tools">
        <p class="seat-side-title">Tilføj bord</p>
        <button type="button" class="seat-tool" data-add-shape="round">
          <span class="seat-tool-preview is-round"></span>
          <span>Rundbord</span>
        </button>
        <button type="button" class="seat-tool" data-add-shape="oval">
          <span class="seat-tool-preview is-oval"></span>
          <span>Ovalt bord</span>
        </button>
        <button type="button" class="seat-tool" data-add-shape="rect">
          <span class="seat-tool-preview is-rect"></span>
          <span>Rektangulært</span>
        </button>
        <button type="button" class="seat-tool" data-add-shape="square">
          <span class="seat-tool-preview is-square"></span>
          <span>Kvadratisk</span>
        </button>
        <p class="seat-hint">Træk borde for at flytte dem. Træk i hjørnerne for at ændre størrelse. Slip gæster direkte på et bord.</p>
      </aside>

      <main class="seat-canvas-wrap" id="seat-canvas-wrap">
        <div class="seat-canvas" id="seat-canvas" tabindex="0">
          <div class="seat-canvas-inner" id="seat-canvas-inner"></div>
        </div>
      </main>

      <aside class="seat-inspector">
        <p class="seat-side-title">Egenskaber</p>
        <div class="seat-props" id="seat-props">
          <p class="seat-props-empty">Vælg et bord for at redigere navn, form, pladser og størrelse.</p>
        </div>

        <p class="seat-side-title">Uplacerede gæster</p>
        <div class="seat-guest-pool" id="seat-guest-pool"></div>
      </aside>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="seating.js"></script>
</body>
</html>
