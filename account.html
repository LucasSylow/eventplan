<!DOCTYPE html>
<html lang="da" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Eventplan</title>
  <link rel="icon" href="assets/logo-mark-white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("eventlink-theme");
      document.documentElement.setAttribute(
        "data-theme",
        saved === "light" || saved === "dark" ? saved : "light"
      );
    })();
  </script>
</head>
<body class="dash-body">
  <div class="dash-app">
    <aside class="dash-sidebar" id="dash-sidebar">
      <div class="dash-sidebar-top">
        <a class="dash-brand" href="index.html" aria-label="Eventplan">
          <img class="dash-brand-word dark-only" src="assets/logo-white.png" alt="Eventplan" height="26" />
          <img class="dash-brand-word light-only" src="assets/logo-blue.png" alt="Eventplan" height="26" />
        </a>

        <nav class="dash-nav" aria-label="Dashboard">
          <a class="dash-nav-link is-active" href="account.html">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            Oversigt
          </a>

          <div class="dash-nav-group is-open">
            <button class="dash-nav-link dash-nav-toggle" type="button" aria-expanded="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5V7M16 3.5V7M3.5 10h17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span>Events</span>
              <svg class="dash-chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="dash-subnav">
              <a class="dash-sublink is-active" href="account.html">Dashboard <span class="dash-sub-arrow" aria-hidden="true">›</span></a>
              <a class="dash-sublink" href="#">Kladder <span class="dash-badge warn">2</span></a>
              <a class="dash-sublink" href="#">Kommende</a>
              <a class="dash-sublink" href="#">Afholdt <span class="dash-badge ok">0</span></a>
            </div>
          </div>

          <a class="dash-nav-link" href="#">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M16 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM8 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM8 13.5c-2.9 0-5.5 1.7-5.5 4.2V20h11v-2.3c0-2.5-2.6-4.2-5.5-4.2zM16 13.5c-.4 0-.8 0-1.2.1 1.6.9 2.7 2.4 2.7 4.1V20H22v-2.3c0-2.5-2.6-4.2-5.5-4.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            Gæster
          </a>
          <a class="dash-nav-link" href="#">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 016.5 5H18l2 3.5v8A2.5 2.5 0 0117.5 19h-11A2.5 2.5 0 014 16.5v-9z" stroke="currentColor" stroke-width="1.7"/><path d="M20 8.5H6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Invitationer
          </a>
          <a class="dash-nav-link" href="#">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M9 12l2.2 2.2L15.5 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.7"/></svg>
            RSVP
          </a>
          <a class="dash-nav-link" href="#">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.2a7.4 7.4 0 000-2.4l2-1.5-1.8-3.1-2.3.7a7.5 7.5 0 00-2.1-1.2L14.8 3h-3.6l-.4 2.7a7.5 7.5 0 00-2.1 1.2l-2.3-.7-1.8 3.1 2 1.5a7.4 7.4 0 000 2.4l-2 1.5 1.8 3.1 2.3-.7a7.5 7.5 0 002.1 1.2l.4 2.7h3.6l.4-2.7a7.5 7.5 0 002.1-1.2l2.3.7 1.8-3.1-2-1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            Indstillinger
          </a>
        </nav>
      </div>

      <div class="dash-sidebar-bottom">
        <a class="dash-nav-link" href="index.html#faq">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.4a2.4 2.4 0 014.5.8c0 1.5-1.4 2.1-2.1 2.6-.5.4-.8.8-.8 1.5M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Hjælp & startguide
          <span class="dash-badge accent">?</span>
        </a>

        <div class="dash-theme-pill" role="group" aria-label="Tema">
          <button type="button" data-theme-set="light" class="is-active">Light</button>
          <button type="button" data-theme-set="dark">Dark</button>
        </div>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <button class="dash-icon-btn dash-menu-btn" type="button" id="dash-menu-btn" aria-label="Åbn menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <label class="dash-search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input type="search" placeholder="Søg eller skriv en kommando…" id="dash-search" />
          <kbd>⌘ F</kbd>
        </label>

        <div class="dash-top-actions">
          <button class="dash-create-btn" type="button" id="dash-create">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Opret
          </button>
          <button class="dash-icon-btn has-dot" type="button" aria-label="Kladder">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M8 4h8a2 2 0 012 2v13l-6-3-6 3V6a2 2 0 012-2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
          <button class="dash-icon-btn has-dot" type="button" aria-label="Notifikationer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 17h12l-1.2-1.8a2 2 0 01-.3-1V10a4.5 4.5 0 00-9 0v4.2a2 2 0 01-.3 1L6 17zM10 19a2 2 0 004 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="dash-avatar" type="button" id="dash-avatar" aria-label="Profilmenu" title="Profil" aria-expanded="false" aria-haspopup="true">
            <span class="dash-avatar-fallback" id="dash-avatar-initials">EP</span>
            <img class="dash-avatar-img" id="dash-avatar-img" alt="" hidden />
          </button>
        </div>
      </header>

      <main class="dash-content" id="dash-content">
        <header class="dash-page-head">
          <p class="dash-empty-kicker">Dashboard</p>
          <h1 id="dash-title">Velkommen</h1>
          <p id="dash-sub">Dit overblik kommer her snart. Navigationen er klar — indhold følger.</p>
        </header>
        <div class="dash-canvas" aria-hidden="true"></div>
      </main>
    </div>
  </div>

  <div class="dash-backdrop" id="dash-backdrop" hidden></div>

  <div class="dash-profile-menu" id="dash-profile-menu" hidden>
    <div class="dash-profile-card">
      <div class="dash-profile-head">
        <div class="dash-avatar dash-avatar-lg" aria-hidden="true">
          <span class="dash-avatar-fallback" id="dash-menu-initials">EP</span>
          <img class="dash-avatar-img" id="dash-menu-avatar-img" alt="" hidden />
        </div>
        <div class="dash-profile-meta">
          <p class="dash-profile-name" id="dash-profile-name">Konto</p>
          <p class="dash-profile-email" id="dash-profile-email"></p>
        </div>
      </div>
      <div class="dash-profile-actions">
        <a href="index.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Forside
        </a>
        <button type="button" id="logout-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M10 7V5a2 2 0 012-2h7a2 2 0 012 2v14a2 2 0 01-2 2h-7a2 2 0 01-2-2v-2M15 12H4m0 0l3-3m-3 3l3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Log ud
        </button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="account.js"></script>
</body>
</html>
