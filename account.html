<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Din konto — Eventplan</title>
  <link rel="icon" href="assets/logo-mark-white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
  <div class="auth-bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
  </div>

  <main class="auth-shell">
    <a class="auth-brand" href="index.html" aria-label="Eventplan">
      <img class="brand-logo" src="assets/logo-white.png" alt="Eventplan" width="150" height="38" />
    </a>

    <section class="auth-card dash-card" id="dash-card">
      <p class="eyebrow" style="display:inline-block;margin:0">Konto</p>
      <h1 id="dash-title">Velkommen</h1>
      <p id="dash-sub">Henter din profil…</p>
      <div class="dash-actions">
        <a class="btn-primary" href="index.html">Gå til forsiden</a>
        <button class="btn-secondary" type="button" id="logout-btn">Log ud</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="account.js"></script>
</body>
</html>
